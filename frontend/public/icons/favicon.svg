<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Browser-tab mark. Same figure as Masthead.tsx, on the dark --bg tile so it
       reads on a light tab strip as well as a dark one. Colours are literal
       because an SVG loaded as a favicon gets no CSS custom properties from the
       page: #10141a is --bg and #8ba6fc is --accent, both dark-scheme.

       This exists because /favicon.ico was 404ing on every page load, which
       Lighthouse counts as a logged browser error. -->
  <rect width="32" height="32" rx="7" fill="#10141a"/>
  <g transform="translate(2.73 2.70) scale(1.086)">
    <circle cx="16" cy="3.6" r="2.4" fill="#8ba6fc"/>
    <path d="M14 7.5 L7.5 14.5 L16.5 17 L13 22" fill="none" stroke="#8ba6fc"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
