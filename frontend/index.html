<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout can use the safe-area insets on
         notched phones once this is installed to the home screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Upload a short clip of your set and get coaching on your form." />
    <meta name="theme-color" content="#12161c" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS still reads these for Add to Home Screen; the manifest alone isn't enough there -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Form Coach" />

    <title>Form Coach — movement feedback</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript to upload and display your analysis.</noscript>

    <!-- Catch beforeinstallprompt HERE rather than in React.
         Chrome fires it early in page load, usually before a module bundle has
         finished parsing and mounted, so a listener added in an effect misses it
         and the install button never appears. Stash it on window and let the
         component pick it up whenever it gets around to mounting. -->
    <script>
      window.__installEvent = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__installEvent = e
        window.dispatchEvent(new Event('installpromptready'))
      })
      window.addEventListener('appinstalled', function () {
        window.__installEvent = null
      })
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
