[pytest]
testpaths = backend/tests

# The faithfulness harness calls a real model many times over: minutes of
# wall clock, a network dependency and an API key, none of which belongs in the
# suite people run while working. Excluded by default, run deliberately:
#
#     python -m pytest -m slow                 only the slow ones
#     python -m pytest -m ""                   everything
#     python scripts/run_faithfulness.py       the full harness, with its report output
#
markers =
    slow: needs a network and GROQ_API_KEY; excluded from the default run

addopts = -m "not slow"
